services:

  postgres:
    image: postgres:16
    container_name: issue-recommender-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: recommender_password
      POSTGRES_DB: issue_recommender

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: issue-recommender-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data: